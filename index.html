<style>
/* Layout: sticky brand header with month + view switch, stacked category cards, fixed bottom tab bar, bottom-sheet forms */
:root{
  --brand:#17885c; --brand-deep:#0f6a47; --brand-ink:#ffffff;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --bg:#0e1412; --card:#18201d; --fg:#e8efeb; --muted:#93a39b; --line:#26302c;
  --bar:#7fb4ff; --link:#6cb6ff; --over:#ff7a6e; --ok:#5fd39b;
  --nav:#131a17; --prog:#5fbf6a; --trk:#2c3632; --shadow:none; --key:#26302c; --keyop:#1e3d2f; --sel:rgba(108,182,255,.24); --done:#2f6fb8; --done-ink:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#136b49; --brand-deep:#0c4f35; --brand-ink:#f2fbf6;
  --bg:#0e1412; --card:#18201d; --fg:#e8efeb; --muted:#93a39b; --line:#26302c;
  --bar:#7fb4ff; --link:#6cb6ff; --over:#ff7a6e; --ok:#5fd39b;
  --nav:#131a17; --prog:#5fbf6a; --trk:#2c3632; --shadow:none; --key:#26302c; --keyop:#1e3d2f; --sel:rgba(108,182,255,.24); --done:#2f6fb8; --done-ink:#ffffff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;-webkit-tap-highlight-color:transparent;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}

.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 6px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.month{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:clamp(22px,6.2vw,28px);line-height:1;text-wrap:balance}
.month b{font-weight:800}.month span{font-weight:600}
.month svg{width:18px;height:18px;flex:none}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:12px}
.iconbtn svg{width:22px;height:22px}
.seg{margin-top:4px;display:grid;grid-template-columns:repeat(3,1fr);background:var(--brand-deep);border-radius:12px;padding:3px}

.seg button[aria-pressed="true"]{background:var(--brand);box-shadow:inset 0 0 0 2px var(--brand-deep);opacity:1}
.banner{background:var(--card);border-bottom:1px solid var(--line);padding-block:5px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:15px;color:var(--ok);text-align:center}
.banner.over{color:var(--over)}
header .banner{margin:6px calc(-1 * max(16px,env(safe-area-inset-right,0px))) -6px calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.banner svg{width:18px;height:18px;flex:none}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;display:flex;flex-direction:column;gap:16px;max-width:640px;margin:0 auto}

.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(86px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:30px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(10,60,40,.35);z-index:6}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--nav);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

.daylabel{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:2px 4px -6px}
.txrow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 0;border-bottom:1px solid var(--line)}
.txrow:last-child{border-bottom:0}
.txrow .l{min-width:0}.txrow .m{font-weight:600;overflow-wrap:anywhere}.txrow .c{font-size:14px;color:var(--muted);margin-top:2px}
.txrow .a{font-weight:600;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border-radius:16px;padding:14px 12px;box-shadow:var(--shadow)}
.tile small{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tile b{display:block;margin-top:6px;font-size:clamp(16px,4.6vw,20px)}
.ibar{padding:10px 0}
.ibar .irow{font-size:16px}
.ibar .sub{font-size:13px;color:var(--muted);margin-top:2px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;padding:14px 16px;border-radius:14px;font-weight:600;background:var(--brand);color:var(--brand-ink);font-size:17px}
.btn.sec{background:var(--bg);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--over);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,15,10,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:24px 24px 0 0;max-height:92%;overflow:auto;padding:10px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));will-change:transform}
@keyframes up{from{transform:translateY(40px);opacity:.4}}

.subs{padding:12px 16px 6px;border-radius:16px;background:var(--glass,var(--bg));border:1px solid var(--glass-edge,var(--line));box-shadow:var(--glass-shade,none);margin-bottom:6px}

.pinc{display:flex;align-items:center;gap:12px}

.pinc>div:not(.ring){min-width:0}

.pday{margin-left:auto;padding-left:12px;border-left:1px solid var(--line);text-align:right;min-width:0;flex:0 1 auto;max-width:44%}

.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;box-shadow:var(--shadow)}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}

.search input::-webkit-search-cancel-button{display:none}
.search button{color:var(--muted);width:32px;height:32px;font-size:15px}

.pace .act{fill:none;stroke:var(--link);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}

.pzwrap{position:relative}

.cal .d b{margin-top:auto;font-size:12px;font-weight:600;text-align:right;white-space:nowrap}
.cal .d i{display:block;height:7px;border-radius:2px;background:#cf7d5f;margin-top:3px}

<script>
document.documentElement.setAttribute("data-theme","light");
(function(){
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>(n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const ymOf=d=>d.slice(0,7);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const round2=n=>Math.round(n*100)/100;
const parseAmt=s=>{const n=parseFloat(String(s).replace(/[^0-9.\-]/g,""));return isFinite(n)?round2(n):NaN};
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

const S={ym:ymOf(today()),view:ls.get("pb.view")||"remaining",tab:"budget",budgets:{},budgetsLoaded:false,tx:[],txLoaded:false,db:null,dbState:"loading",readOnly:false};
let txUnsub=null, toastT=null;

function toast(msg){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2200)}

/* ---------- budget model ---------- */
function templateFor(ym){
  const ids=Object.keys(S.budgets).sort();
  let prior=ids.filter(i=>i<ym).pop()||ids.filter(i=>i>ym)[0];
  return prior?JSON.parse(JSON.stringify(S.budgets[prior].groups||[])):null;
}
let PAD=null;
function incomeFor(ym){const inc=incomeForBase(ym);if(PAD&&PAD.kind==="income"&&PAD.ym===ym)return inc.map(x=>x.id===PAD.id?Object.assign({},x,{planned:padValue()/100}):x);return inc}
function incomeForBase(ym){const b=S.budgets[ym];if(b&&Array.isArray(b.income))return b.income;
  const ids=Object.keys(S.budgets).filter(i=>Array.isArray(S.budgets[i].income)).sort();
  const prior=ids.filter(i=>i<ym).pop()||ids.filter(i=>i>ym)[0];
  return prior?JSON.parse(JSON.stringify(S.budgets[prior].income)):[]}
const incomeTotal=inc=>round2(inc.reduce((a,x)=>a+(+x.planned||0),0));
function groupsFor(ym){const b=S.budgets[ym];const g=b?(b.groups||[]):(templateFor(ym)||[]);
  if(PAD&&PAD.kind==="item"&&PAD.ym===ym)return g.map(x=>Object.assign({},x,{items:x.items.map(it=>it.id===PAD.id?Object.assign({},it,{planned:padValue()/100}):it)}));
  return g}
async function saveGroups(groups,income){
  if(!S.db||S.readOnly){toast("Saving isn't available here");return false}
  try{await S.db.doc("budgets/"+S.ym).set({groups,income:income||incomeFor(S.ym),updatedAt:new Date().toISOString()});return true}
  catch(e){toast(e&&e.code==="quota_exceeded"?"Storage is full":"Couldn't save. Check your connection.");return false}
}
function allItems(groups){const out=[];groups.forEach(g=>g.items.forEach(it=>out.push({g,it})));return out}
const sAmt=t=>t.type==="income"?0:(t.type==="refund"?-1:1)*(+t.amount||0);
function receivedMap(){const m={};S.tx.forEach(t=>{if(t.type==="income")m[t.itemId]=(m[t.itemId]||0)+(+t.amount||0)});return m}
function spentMap(){const m={};S.tx.forEach(t=>{m[t.itemId]=(m[t.itemId]||0)+sAmt(t)});return m}

/* ---------- Google Sheets link ---------- */
const SHEET={id:"1Mym1STy0HBwhCcBAao_-awzpPA4J9f5_QgrHN8pXFTQ",tabId:2026001,tab:"Transactions",row:11};
const SHEET_URL="https://docs.google.com/spreadsheets/d/"+SHEET.id+"/edit#gid="+SHEET.tabId;
let mcpP=null;const getMcp=()=>mcpP||(mcpP=(window.claude?.use?.("mcp")||Promise.resolve(null)).catch(()=>null));
const serial=d=>{const [y,m,dd]=d.split("-").map(Number);return Math.round((Date.UTC(y,m-1,dd)-Date.UTC(1899,11,30))/864e5)};
function sheetErrMsg(e){const c=e&&e.code;
  if(c==="not_configured")return"Set up Google Sheet sync (gear icon at the top), then tap Send to sheet.";
  if(c==="wrong_key")return"Your sheet script refused the key. Check Script key under gear icon → Google Sheet sync.";
  if(c==="tool_error")return"Google Sheets refused the row: "+(e.message||"").slice(0,120);
  return"Couldn't reach Google Sheets. Tap Send to sheet to try again.";}
async function pushToSheet(id,t){
  const mcp=await getMcp();
  if(!mcp){await markSheet(id,"failed","Google Sheets isn't available in this view.");return false}
  const row=sheetRow(t);
  if(mcp.pbAppend){ // standalone app: one call that won't double-add a row it already wrote
    try{await mcp.pbAppend(id,row);await markSheet(id,"synced","");return true}
    catch(e){await markSheet(id,"failed",sheetErrMsg(e));toast("Saved here, not in your sheet yet");return false}
  }
  let inserted=false;
  try{
    await mcp.callTool("Google Sheets","insert_dimension",{spreadsheetId:SHEET.id,sheetId:SHEET.tabId,dimension:"ROWS",startIndex:SHEET.row-1,endIndex:SHEET.row,inheritFromBefore:false});
    inserted=true;
    await mcp.callTool("Google Sheets","update_values",{spreadsheetId:SHEET.id,range:SHEET.tab+"!A"+SHEET.row+":E"+SHEET.row,values:[row]});
    await markSheet(id,"synced","");return true;
  }catch(e){
    const msg=sheetErrMsg(e);
    await markSheet(id,"failed",msg);toast("Saved here, not in your sheet yet");return false;
  }
}
function sheetRow(t){const amt=round2((t.type==="refund"||t.type==="income"?1:-1)*(+t.amount||0));return[serial(t.date),t.merchant||"Purchase",t.itemName||"Misc",amt,t.note||""]}
/* A row can land in the sheet even when the phone never hears back (signal drops,
   app goes to the background). Ask the sheet which "not in sheet" rows it already has. */
const RC=new Set();let rcBusy=false;
async function reconcileSheet(){
  if(rcBusy||S.readOnly||!S.db)return;const mcp=await getMcp();if(!mcp||!mcp.pbCheck)return;
  const list=S.tx.filter(t=>t.sheet!=="synced"&&!isHist(t)&&!RC.has(t.id));if(!list.length)return;
  rcBusy=true;list.forEach(t=>RC.add(t.id));
  try{const found=await mcp.pbCheck(list.map(t=>({id:t.id,row:sheetRow(t)})));for(const id of found||[])await markSheet(id,"synced","")}catch(e){}
  rcBusy=false;
}
async function markSheet(id,state,msg){try{await S.db.doc("tx/"+id).update({sheet:state,sheetMsg:msg})}catch(e){}}
function findItem(groups,id){for(const g of groups)for(const it of g.items)if(it.id===id)return{g,it};return null}

/* ---------- history from the Finance Tracker ----------
   Months before HIST_BEFORE come from the Transactions tab. They are stored one
   document per month (hist/YYYY-MM) and shown read-only; the sheet stays the record. */
const HIST_BEFORE="2026-10";
const EXTRA_G={id:"g-sheet-extra",name:"Other categories"};
const H={meta:null,metaLoaded:false,running:false,progress:"",err:""};
const MIDX={january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12,jan:1,feb:2,mar:3,apr:4,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
function validYmd(y,m,d){return y>=1990&&y<=2100&&m>=1&&m<=12&&d>=1&&d<=31?y+"-"+pad(m)+"-"+pad(d):null}
function parseSheetDate(v){
  if(typeof v==="number"&&v>20000&&v<80000){const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);return validYmd(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate())}
  const s=String(v??"").trim();let m;
  if((m=s.match(/^(?:[A-Za-z]+,\s*)?([A-Za-z]+)\.?\s+(\d{1,2}),?\s+(\d{4})$/))){const mo=MIDX[m[1].toLowerCase()];return mo?validYmd(+m[3],mo,+m[2]):null}
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/))){let y=+m[3];if(y<100)y+=2000;return validYmd(y,+m[1],+m[2])}
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return validYmd(+m[1],+m[2],+m[3]);
  if(/^\d{5}(\.\d+)?$/.test(s))return parseSheetDate(+s);
  return null}
function parseSheetAmt(v){if(typeof v==="number")return v;let s=String(v??"").trim();if(!s)return NaN;const neg=/^\(.*\)$/.test(s)||/^-/.test(s)||/^\$\s*-/.test(s);s=s.replace(/[^0-9.]/g,"");if(!s)return NaN;const n=parseFloat(s);return isNaN(n)?NaN:(neg?-n:n)}
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"misc";
function valuesOf(res){
  let p=res&&res.payload;
  if(typeof p==="string"){try{p=JSON.parse(p)}catch(e){p=null}}
  if(p&&Array.isArray(p.values))return p.values;
  const sc=res&&res.structuredContent;if(sc&&Array.isArray(sc.values))return sc.values;
  const tb=res&&Array.isArray(res.content)&&res.content.find(c=>c.type==="text");
  if(tb){try{const j=JSON.parse(tb.text);if(j&&Array.isArray(j.values))return j.values}catch(e){}}
  if(p&&typeof p==="object"&&"range" in p)return [];
  throw {code:"tool_error",message:"Unexpected reply from Google Sheets"};
}
function histToTx(ym,data){
  const rows=data&&Array.isArray(data.rows)?data.rows:[];
  return rows.map((r,i)=>({id:"h:"+ym+":"+i,source:"history",date:r.d,merchant:r.m,itemId:r.i,itemName:r.n,groupName:r.g,sub:r.s||"",amount:+r.a||0,type:r.t==="refund"?"refund":"expense",note:r.o||"",sheet:"synced",createdAt:""}));
}
const isHist=t=>t&&t.source==="history";
async function retryOnce(fn){try{return await fn()}catch(e){if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,600+Math.random()*800));return fn()}throw e}}
async function importHistory(){
  if(H.running)return;
  if(!S.db||S.readOnly){toast("Only the owner can bring in history");return}
  const mcp=await getMcp();
  if(!mcp){H.err="Set up Google Sheet sync first (gear icon at the top).";render();return}
  H.running=true;H.err="";H.progress="Reading your Transactions tab…";render();
  try{
    const rows=[];const CH=1500;
    for(let start=11;start<40000;start+=CH){
      const res=await mcp.callTool("Google Sheets","get_values",{spreadsheetId:SHEET.id,range:SHEET.tab+"!A"+start+":E"+(start+CH-1)},{cache:false});
      const vals=valuesOf(res);rows.push(...vals);
      H.progress="Read "+rows.length.toLocaleString()+" rows from your sheet…";render();
      if(vals.length<CH)break;
    }
    const tpl=JSON.parse(JSON.stringify(groupsFor(HIST_BEFORE)));
    const byName={};tpl.forEach(g=>g.items.forEach(it=>{byName[String(it.name).trim().toLowerCase()]={id:it.id,name:it.name,g:g.name}}));
    const months={},extras={};let skipped=0,count=0;
    rows.forEach(r=>{
      r=Array.isArray(r)?r:[];
      const d=parseSheetDate(r[0]),a=parseSheetAmt(r[3]);
      if(!d||isNaN(a)||a===0){if(r.some(x=>String(x??"").trim()))skipped++;return}
      const ym=ymOf(d);if(ym>=HIST_BEFORE)return;
      const cat=String(r[2]??"").trim()||"Misc";
      const it=byName[cat.toLowerCase()]||{id:"x-"+slug(cat),name:cat,g:EXTRA_G.name,extra:true};
      if(it.extra)(extras[ym]=extras[ym]||{})[it.id]=it.name;
      (months[ym]=months[ym]||[]).push({d,m:String(r[1]??"").trim(),i:it.id,n:it.name,g:it.g,a:round2(Math.abs(a)),t:a>0?"refund":"expense",o:String(r[4]??"").trim()});
      count++;
    });
    const yms=Object.keys(months).sort();
    if(!yms.length)throw {code:"empty",message:"No rows before "+MONTHS[+HIST_BEFORE.slice(5)-1]+" "+HIST_BEFORE.slice(0,4)+" were found in your Transactions tab."};
    let done=0;const stamp=new Date().toISOString();
    for(const ym of yms){
      months[ym].sort((x,y)=>x.d<y.d?1:x.d>y.d?-1:0);
      await retryOnce(()=>S.db.doc("hist/"+ym).set({rows:months[ym],importedAt:stamp}));
      const ex=extras[ym]||{},exIds=Object.keys(ex);
      const b=S.budgets[ym];
      if(!b){
        const groups=JSON.parse(JSON.stringify(tpl));
        if(exIds.length)groups.push({id:EXTRA_G.id,name:EXTRA_G.name,items:exIds.map(id=>({id,name:ex[id],planned:0}))});
        await retryOnce(()=>S.db.doc("budgets/"+ym).set({groups,updatedAt:stamp,source:"history"}));
      }else if(exIds.length){
        const groups=JSON.parse(JSON.stringify(b.groups||[]));
        const have=new Set(allItems(groups).map(x=>x.it.id));const add=exIds.filter(id=>!have.has(id));
        if(add.length){let g=groups.find(x=>x.id===EXTRA_G.id);if(!g){g={id:EXTRA_G.id,name:EXTRA_G.name,items:[]};groups.push(g)}
          add.forEach(id=>g.items.push({id,name:ex[id],planned:0}));
          await retryOnce(()=>S.db.doc("budgets/"+ym).update({groups,updatedAt:stamp}))}
      }
      done++;if(done%4===0||done===yms.length){H.progress="Saved "+done+" of "+yms.length+" months…";render()}
    }
    await retryOnce(()=>S.db.doc("meta/history").set({importedAt:stamp,months:yms.length,rows:count,skipped,first:yms[0],last:yms[yms.length-1]}));
    IS.hist={};IS.loading={};
    toast("Brought in "+count.toLocaleString()+" transactions");
  }catch(e){
    const c=e&&e.code;
    H.err=c==="quota_exceeded"?"The app's storage is full, so not every month was saved.":c==="empty"?e.message:(c&&/^(not_configured|wrong_key|tool_error)$/.test(c))?sheetErrMsg(e).replace("tap Send to sheet","tap Bring in history"):"Something interrupted the import. Tap Bring in history to finish; months already saved stay put.";
  }finally{H.running=false;H.progress="";render()}
}
function historyCardHTML(){
  if(S.ym>=HIST_BEFORE||S.dbState!=="ok"||!H.metaLoaded)return "";
  if(H.running)return '<section class="card"><div class="chead"><h2>Bringing in your history</h2></div><p class="note" role="status" style="margin:4px 0 0">'+esc(H.progress)+'</p><p class="note" style="margin:8px 0 0">Keep this page open until it finishes.</p></section>';
  if(H.meta&&!H.err)return "";

/* ---------- Totals · By month (interactive stacked bars) ---------- */
function barChartI(months,series,keys,cm,label){
  const W=340,H=230,L=44,R=8,T=14,B=26,pw=W-L-R,ph=H-T-B;
  const tot=months.map(ym=>keys.reduce((a,k)=>a+Math.max(0,(series[ym]||{})[k]||0),0));
  const used=tot.filter(v=>v>0),avg=used.length?used.reduce((a,b)=>a+b,0)/used.length:0;
  const max=niceMax(Math.max(...tot,avg));
  const step=pw/months.length,bw=Math.min(30,step*0.64);
  const key=[months.join(),keys.join("|"),Math.round(tot.reduce((a,b)=>a+b,0))].join("~"),anim=IS.bmKey!==key;IS.bmKey=key;
  if(IS.bmSel&&!months.includes(IS.bmSel))IS.bmSel=null;
  IS.bm={months,series,keys,cm,tot,avg,label};
  let g='';
  for(let i=0;i<=4;i++){const y=T+ph-ph*i/4;g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" class="grid"/><text x="'+(L-6)+'" y="'+(y+4)+'" class="ax" text-anchor="end">'+kfmt(max*i/4)+'</text>'}
  months.forEach((ym,mi)=>{
    const x=L+step*mi+(step-bw)/2;let y=T+ph;const parts=keys.map(k=>[k,Math.max(0,(series[ym]||{})[k]||0)]).filter(p=>p[1]>0);
    let col='';parts.forEach(([k,v],pi)=>{const hh=ph*v/max;y-=hh;col+='<path d="'+barPath(x,y,bw,hh,pi===parts.length-1?4:0)+'" fill="'+cm[k]+'"/>'});
    g+='<g class="bcol'+(IS.bmSel?(IS.bmSel===ym?' on':' dim'):'')+'" data-bm="'+ym+'" style="--d:'+(mi*0.05).toFixed(2)+'s"><rect class="bhit" x="'+(L+step*mi)+'" y="'+T+'" width="'+step+'" height="'+(ph+B)+'" fill="transparent"/><g class="bstack">'+col+'</g><text x="'+(x+bw/2)+'" y="'+(H-8)+'" class="ax" text-anchor="middle">'+shortM(ym)+'</text></g>';
  });
  if(avg){const y=T+ph-ph*avg/max;g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" class="avg"/>'}
  return '<div class="bmread" id="bmread">'+bmReadHTML()+'</div><svg class="chart bmc'+(anim?' anim':'')+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Spending by month for '+esc(label)+'. Tap a month for its breakdown.">'+g+'</svg>';
}
function bmReadHTML(){
  const b=IS.bm;if(!b)return"";const span=b.months[0].slice(0,4)!==b.months[b.months.length-1].slice(0,4);

  h+=g;
  h+='<div class="calleg"><span>'+money(tot)+' this month</span><span class="scale">Less<i style="--h:.12"></i><i style="--h:.38"></i><i style="--h:.65"></i><i style="--h:.92"></i>More</span></div>';

/* ---------- Pace extras: budget-vs-month rings, how each group is pacing ---------- */
function paceRings(spentNow,planned,dayNow,dim,cur){
  const mp=dayNow/dim,sp=planned>0?spentNow/planned:0,over=sp>mp+.005,bust=sp>1.0001;
  const ring=(r,f,col,cls)=>{const C=2*Math.PI*r;return '<circle cx="60" cy="60" r="'+r+'" fill="none" stroke="var(--trk)" stroke-width="11"/><circle class="garc '+cls+'" cx="60" cy="60" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+(C*Math.min(1,f)).toFixed(1)+' '+C.toFixed(1)+'" style="--C:'+C.toFixed(1)+'" transform="rotate(-90 60 60)"/>'};
  return '<div class="prings"><svg viewBox="0 0 120 120" aria-hidden="true">'+ring(50,mp,"#9aa0a6","g1")+ring(34,sp,bust?"var(--over)":over?"#f9ab00":"var(--ok)","g2")+
    '<text x="60" y="58" text-anchor="middle" class="gv num">'+Math.round(sp*100)+'%</text><text x="60" y="74" text-anchor="middle" class="gl">of budget</text></svg>'+
    '<div class="pringt"><div><i style="background:'+(bust?"var(--over)":over?"#f9ab00":"var(--ok)")+'"></i><b class="num">'+Math.round(sp*100)+'%</b> of the budget used</div><div><i style="background:#9aa0a6"></i><b class="num">'+Math.round(mp*100)+'%</b> of the month '+(cur?"gone":"")+'</div>'+
    '<p class="'+(bust?"bad":over?"warn":"ok")+'">'+(cur?(bust?"Already past the plan for the month.":over?"Ahead of the calendar — bills paid early count here too.":"You're spending slower than the month is passing."):(sp>1?"Went over plan.":"Stayed within plan."))+'</p></div></div>';
}
function paceGroupsHTML(ym,dayNow,dim){
  if(IS.item||!dayNow)return"";
  const td=today(),mp=dayNow/dim,groups=groupsFor(ym),rows=[];
  const spent={};txOf(ym).forEach(t=>{if(t.type==="income"||t.date>td)return;const g=groupNameOf(t,ym);if(IS.group&&g!==IS.group)return;const k=IS.group?itemNameOf(t,ym):g;spent[k]=(spent[k]||0)+sAmt(t)});
  if(IS.group){groups.filter(g=>g.name===IS.group).forEach(g=>g.items.forEach(it=>{if(+it.planned>0)rows.push([it.name,+it.planned])}))}
  else groups.forEach(g=>{const p=g.items.reduce((a,it)=>a+(+it.planned||0),0);if(p>0)rows.push([g.name,p])});
  if(!rows.length)return"";
  rows.forEach(r=>r.push(round2(spent[r[0]]||0)));rows.sort((a,b)=>(b[2]/b[1]-mp)-(a[2]/a[1]-mp));
  return '<div class="pgroups"><h4>How each '+(IS.group?"item":"group")+' is pacing <span>· tap to focus</span></h4>'+rows.map(([n,p,s],i)=>{const f=s/p,over=s>p+.5,done=!over&&s>=p-.5,ahead=!over&&!done&&f>mp+.02;
    return '<button class="pgr" data-pgo="'+esc(n)+'" style="--d:'+(i*0.05).toFixed(2)+'s"><div class="pgt"><span class="pn">'+esc(n)+'</span><span class="num">'+(done?'<em class="pdone">✓ </em>':'')+'<b>'+money(round2(s)).replace(/\.\d\d$/,"")+'</b> / '+money(p).replace(/\.\d\d$/,"")+'</span></div><div class="pgb"><i class="'+(over?"over":done?"done":ahead?"ahead":"")+'" style="width:'+Math.min(100,f*100).toFixed(1)+'%"></i><u style="left:'+(mp*100).toFixed(1)+'%"></u></div></button>'}).join("")+'</div>';

function wdVals(m){const D=IS.wdData;return WD_ORDER.map(w=>m==="total"?D.sum[w]:m==="count"?(D.days[w]?D.cnt[w]/D.days[w]:0):(D.days[w]?D.sum[w]/D.days[w]:0))}

function weekdayCard(fh,months,pending){
  const td=today(),cur=ymOf(td);
  const days=Array(7).fill(0),sum=Array(7).fill(0),cnt=Array(7).fill(0),cat=Array.from({length:7},()=>({})),mer=Array.from({length:7},()=>({})),dayTot={};

    if(ym>cur)return;

    const fixed=new Set();if(IS.wdVar)groupsFor(ym).forEach(g=>g.items.forEach(it=>{if(isFixed(it,g))fixed.add(it.id)}));
    txOf(ym).forEach(t=>{
      if(t.type==="income"||!t.date||t.date>td||fixed.has(t.itemId))return;
      const g=groupNameOf(t,ym),it=itemNameOf(t,ym);
      if(IS.group&&g!==IS.group)return;if(IS.item&&it!==IS.item)return;
      const [yy,mm,dd]=t.date.split("-").map(Number),w=new Date(yy,mm-1,dd).getDay(),a=sAmt(t);
      sum[w]+=a;if(t.type!=="refund")cnt[w]++;
      const ck=IS.group?it:g;cat[w][ck]=(cat[w][ck]||0)+a;
      const mk=String(t.merchant||"Purchase").replace(/^\s*venmo\s*:\s*/i,"").trim()||"Purchase";mer[w][mk]=(mer[w][mk]||0)+a;
      dayTot[t.date]=(dayTot[t.date]||0)+a});
  });
  const totDays=days.reduce((a,b)=>a+b,0),totSum=sum.reduce((a,b)=>a+b,0),cntAll=cnt.reduce((a,b)=>a+b,0);
  const big=Array(7).fill(null);Object.entries(dayTot).forEach(([d,v])=>{const [yy,mm,dd]=d.split("-").map(Number),w=new Date(yy,mm-1,dd).getDay();if(!big[w]||v>big[w][1])big[w]=[d,v]});

/* ---------- sheets ---------- */
function openSheet(html,bind){
  const root=$("#sheetRoot");
  root.innerHTML='<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>'+html+'</div></div>';
  document.body.style.overflow="hidden";
  $("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeSheet()});
  const sh=root.querySelector(".sheet"),sc=root.firstChild;
  dragSheet(sc,sh);
  bind&&bind(sh);
  slideIn(sc,sh);
}
// Open: start fully below the screen with a clear scrim, then glide up on the same
// iOS-style curve the drag-to-dismiss uses, so opening and closing feel like one motion.
const SHEET_EASE="cubic-bezier(.32,.72,0,1)",SHEET_IN=380;
function slideIn(sc,sh){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  sh.style.transition="none";sc.style.transition="none";
  sh.style.transform="translateY(100%)";sc.style.background="rgba(5,15,10,0)";
  void sh.offsetHeight;// commit the off-screen start position before animating
  requestAnimationFrame(()=>{
    sh.style.transition="transform "+SHEET_IN+"ms "+SHEET_EASE;sc.style.transition="background "+SHEET_IN+"ms ease-out";
    sh.style.transform="";sc.style.background="";sh._opening=true;
    // clear only if nothing (a drag or a close) has taken over the sheet since
    setTimeout(()=>{if(sh._opening){sh._opening=false;sh.style.transition="";sc.style.transition=""}},SHEET_IN+40);
  });
}
function dragSheet(sc,sh){
  let y0=0,x0=0,dy=0,t0=0,pts=[],mode=0;// 0 undecided, 1 dragging, -1 not
  const scrolledAbove=el=>{for(;el&&el!==sh.parentNode;el=el.parentNode){if(el.scrollTop>0)return true}return false};
  sh.addEventListener("touchstart",e=>{if(e.touches.length!==1){mode=-1;return}const t=e.touches[0];y0=t.clientY;x0=t.clientX;dy=0;t0=Date.now();pts=[[t0,y0]];mode=scrolledAbove(e.target)?-1:0},{passive:true});
  sh.addEventListener("touchmove",e=>{if(mode===-1)return;const t=e.touches[0],d=t.clientY-y0;
    if(mode===0){if(Math.abs(t.clientX-x0)>Math.abs(d)&&Math.abs(t.clientX-x0)>8){mode=-1;return}if(d>8){mode=1;sh._opening=false;sh.style.transition="none";sh.style.animation="none";if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()}else if(d<-4){mode=-1;return}else return}
    e.preventDefault();dy=Math.max(0,d-8);sh.style.transform="translateY("+dy+"px)";sc.style.background="rgba(5,15,10,"+(0.45*Math.max(0,1-dy/(sh.offsetHeight||1))).toFixed(3)+")";
    const now=Date.now();pts.push([now,t.clientY]);while(pts.length>2&&now-pts[0][0]>100)pts.shift()},{passive:false});
  const end=()=>{if(mode!==1){mode=0;return}mode=0;
    const a=pts[0],b=pts[pts.length-1],v=b&&a&&b[0]>a[0]?(b[1]-a[1])/(b[0]-a[0]):0;
    if(dy>Math.min(140,sh.offsetHeight*0.3)||v>0.6)closeSheet();
    else{sh.style.transition="transform .32s "+SHEET_EASE;sc.style.transition="background .28s";sh.style.transform="";sc.style.background="";setTimeout(()=>{sh.style.transition="";sc.style.transition=""},300)}};
  sh.addEventListener("touchend",end);sh.addEventListener("touchcancel",end);
}
function closeSheet(){
  const root=$("#sheetRoot"),sc=root.firstChild;document.body.style.overflow="";
  if(!sc)return;const sh=sc.querySelector(".sheet");
  if(!sh||matchMedia("(prefers-reduced-motion:reduce)").matches){root.innerHTML="";return}
  sc.style.pointerEvents="none";sh._opening=false;
  sh.style.animation="none";sh.style.transition="transform .26s cubic-bezier(.4,0,.6,1)";sc.style.transition="background .26s";
  requestAnimationFrame(()=>{sh.style.transform="translateY("+(sh.offsetHeight+40)+"px)";sc.style.background="rgba(5,15,10,0)"});
  setTimeout(()=>{if(root.firstChild===sc)root.innerHTML=""},280);
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(PAD){cancelPad();return}closeSheet()}});

/* ---------- number pad for planned amounts ---------- */
// Entry works in cents: typing 5,0,0,0,0 gives $500.00. The first key replaces the old amount.
const OPS={"+":(a,b)=>a+b,"−":(a,b)=>a-b,"×":(a,b)=>Math.round(a*b/100),"÷":(a,b)=>b?Math.round(a/(b/100)):a};
const curCents=()=>PAD.cur===""?0:+PAD.cur;
function padValue(){if(!PAD)return 0;if(!PAD.ops.length)return Math.max(0,curCents());
  let acc=PAD.ops[0][0];for(let i=0;i<PAD.ops.length;i++){const nx=i+1<PAD.ops.length?PAD.ops[i+1][0]:(PAD.cur===""?null:curCents());if(nx===null)break;acc=OPS[PAD.ops[i][1]](acc,nx)}
  return Math.max(0,acc)}
function padOpen(kind,id){
  if(!S.db||S.readOnly){toast("Saving isn't available here");return}
  if(PAD){if(PAD.kind===kind&&PAD.id===id)return;commitPad()}
  const src=kind==="income"?incomeFor(S.ym).find(x=>x.id===id):((findItem(groupsFor(S.ym),id)||{}).it);
  if(!src)return;
  const c=Math.round((+src.planned||0)*100);
  PAD={kind,id,ym:S.ym,name:src.name,orig:c,cur:String(c),ops:[],fresh:true,calc:ls.get("pb.calc")==="1"};
  document.body.classList.add("padopen");drawPad();render();
  requestAnimationFrame(()=>{const el=document.querySelector(kind==="item"?'[data-plan="'+CSS.escape(id)+'"]':'[data-iplan="'+CSS.escape(id)+'"]');
    if(el){const r=el.getBoundingClientRect(),pad=$(".pad"),top=pad?pad.getBoundingClientRect().top:innerHeight;
