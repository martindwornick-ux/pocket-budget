<script>
(async function(){
  try{const r=await navigator.serviceWorker?.getRegistration("./");if(r)await r.unregister()}catch(e){}
  try{for(const k of await caches.keys())if(k.startsWith("pv-"))await caches.delete(k)}catch(e){}
  location.replace("../");
})();
</script>
