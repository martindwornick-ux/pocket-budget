<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pocket Budget</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
html,body{overscroll-behavior-y:auto}
/* polish pass Nov 13: skeletons, group headers, + clearance, slim shortcuts, bills chip, update pill */
.skel{background:linear-gradient(90deg,var(--line) 0%,color-mix(in srgb,var(--line) 45%,transparent) 50%,var(--line) 100%);background-size:200% 100%;animation:skel 1.3s ease-in-out infinite;animation-delay:var(--d,0s);border-radius:10px}
@keyframes skel{from{background-position:100% 0}to{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.sk-line{height:12px;width:46%;margin:6px 0 10px}
.skbars{display:flex;align-items:flex-end;gap:12px;height:150px;padding:8px 6px 0;margin-bottom:6px}.skbars i{flex:1;border-radius:8px 8px 4px 4px}
.gcard:not(.open) .dots{display:none}.gcard:not(.open) .gtog{margin-right:0}
body:not(.padopen){padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
.qlinks{display:flex;gap:8px;margin:-4px 0 -6px}
.qlinks a{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;background:var(--card);border:1px solid var(--line);color:var(--link);font-size:15px;font-weight:600;text-decoration:none}
.qlinks a svg{width:17px;height:17px}
.fxchip{display:inline-flex;align-items:center;gap:6px;margin:2px 0 8px;padding:6px 12px;border-radius:16px;background:color-mix(in srgb,var(--line) 60%,transparent);color:var(--muted);font-size:14px;font-weight:500}
.fxchip u{color:var(--link);text-decoration:none;font-weight:600}
#updpill{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);translate:-50% -140%;z-index:60;padding:10px 16px;border-radius:22px;background:#202124;color:#fff;font-size:15px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:translate .35s cubic-bezier(.2,.9,.3,1);white-space:nowrap}
#updpill.on{translate:-50% 0}#updpill b{color:#8ab4f8;margin-left:6px}
</style>
<script>window.PB_BUILD="Nov 14, 5:30 PM"</script>
<script src="config.js"></script>
<script src="platform.js"></script>
</head><body>
<link rel="preload" href="hanken-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<style>@font-face{font-family:"Hanken Grotesk";font-style:normal;font-weight:100 900;font-display:swap;src:url(hanken-grotesk.woff2) format("woff2")}</style>
<style>
@@include css/base.css
@@include css/sheets.css
@@include css/theme.css
@@include css/insights.css
@@include css/polish.css
</style>

<header>
  <div class="hrow">
    <button class="month" id="monthBtn" aria-label="Choose month"><b id="mName">October</b> <span id="mYear">2026</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button>
    <button class="doodle" id="doodle" aria-label="Monthly doodle"></button>

  </div>
  <div class="seg" id="seg" role="group" aria-label="Amount shown">
    <button id="v-planned" data-v="planned" aria-pressed="false">Planned</button>
    <button id="v-spent" data-v="spent" aria-pressed="false">Spent</button>
    <button id="v-remaining" data-v="remaining" aria-pressed="true">Remaining</button>
  </div>
  <div id="hsearch" hidden><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="txq" type="search" enterkeyhint="search" autocomplete="off" aria-label="Search transactions"><button id="txqClear" aria-label="Clear search" hidden>✕</button></div></div>
  <div class="seg hsub" id="hisub" role="group" aria-label="Insight" hidden></div>
  <div class="banner" id="banner"><span>Loading your budget…</span></div><button class="nowbar" id="nowBar" hidden></button>
</header>
<main id="main"></main>
<button class="fab" id="fab" aria-label="Add transaction"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="tabs" aria-label="Sections">
  <button data-tab="budget" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18M7 15h4"/></svg>Budget</button>
  <button data-tab="tx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M15 9.2c-.6-.9-1.7-1.4-3-1.4-1.7 0-3 .9-3 2.1 0 2.9 6 1.4 6 4.3 0 1.2-1.3 2.1-3 2.1-1.4 0-2.6-.6-3.1-1.6M12 6v1.8M12 16.3V18"/></svg>Transactions</button>
  <button data-tab="insights"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 20v-7M12 20V5M18 20v-10"/></svg>Insights</button>
</nav>
<div id="sheetRoot"></div>
<div id="padRoot"></div>

<script>
@@include js/core.js
@@include js/budget.js
@@include js/history-merchants.js
@@include js/location.js
@@include js/item-suggest.js
@@include js/insights-totals.js
@@include js/insights-calendar-pace.js
@@include js/insights-map.js
@@include js/insights-average.js
@@include js/sheets-numpad.js
@@include js/transactions.js
@@include js/events-data.js
@@include js/gestures.js
</script>

<script>/* Instant launch: the app opens from the phone's copy. When a new release installs, show a pill; tap it to switch. */
(function(){if(!("serviceWorker" in navigator))return;const had=!!navigator.serviceWorker.controller;let shown=false;
navigator.serviceWorker.addEventListener("controllerchange",function(){if(!had||shown)return;shown=true;
  const b=document.createElement("button");b.id="updpill";b.type="button";b.innerHTML="Update ready<b>Tap to refresh</b>";b.onclick=function(){location.reload()};
  document.body.appendChild(b);requestAnimationFrame(function(){requestAnimationFrame(function(){b.classList.add("on")})});
});
})();</script>
</body></html>
